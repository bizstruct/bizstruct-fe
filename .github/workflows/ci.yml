name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: pnpm test

      - name: Sync domain types from bizstruct-domain
        run: pnpm run sync:domain

      - name: Fail if committed domain types drifted from bizstruct-domain
        run: git diff --exit-code src/types/domain/
